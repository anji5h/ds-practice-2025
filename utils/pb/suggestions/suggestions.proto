// suggestion.proto

syntax = "proto3";

import "google/protobuf/empty.proto";

package suggestion;

service SuggestionService {
    rpc InitOrder(OrderRequest) returns (google.protobuf.Empty);
    rpc GetSuggestions (SuggestionRequest) returns (SuggestionsResponse);
}

message User {
    string name = 1;
    string contact = 2;
}

message CreditCard {
    string number = 1;
    string expirationDate = 2;
    string cvv = 3;
}

message Item {
    string name = 1;
    int32 quantity = 2;
}

message Address {
    string street = 1;
    string city = 2;
    string state = 3;
    string zip = 4;
    string country = 5;
}

message OrderData{
    User user = 1;
    CreditCard credit_card = 2;
    repeated Item items = 3;
    Address billing_address = 4;
    Address shipping_address = 5;
    string shipping_method = 6;
    bool gift_wrapping = 7;
    string user_comment = 8;
    bool terms_accepted = 9;
}

message OrderRequest{
    string order_id = 1;
    OrderData order_data = 2;
}

message SuggestionRequest {
    string order_id = 1;
}

message SuggestionsResponse {
    repeated string suggestions = 1;
}