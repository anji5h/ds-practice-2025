syntax = "proto3";

import "google/protobuf/empty.proto";

package suggestion;

service SuggestionService {
    rpc InitOrder(OrderRequest) returns (google.protobuf.Empty);
    rpc GetSuggestions (SuggestionRequest) returns (SuggestionsResponse);
    rpc CleanOrder (SuggestionRequest) returns (CleanOrderResponse);
}

message OrderRequest{
    string order_id = 1;
    string order_data = 2;
}

message SuggestionRequest {
    string order_id = 1;
    repeated int32 vc = 2;
}

message CleanOrderResponse{
    string result = 1;
    repeated int32 vc = 2;
}

message Book {
  string title = 1;
  string author = 2;
  string description = 3;
  string link = 4;
}

message SuggestionsResponse {
  repeated Book suggestedBooks = 1;
  repeated int32 vc = 2;
}
